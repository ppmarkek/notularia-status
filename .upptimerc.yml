owner: ppmarkek
repo: notularia-status

# What people of Notularia rely on from us. The app itself works offline; these are the
# services that buying, activating and recovering a licence and the website need.
sites:
  - name: Licence service
    url: https://api.notularia.com/healthz
    expectedStatusCodes:
      - 200
    maxResponseTime: 5000
  - name: Website
    url: https://notularia.com
    maxResponseTime: 5000

# An outage opens an issue assigned here, which GitHub Mobile turns into a notification.
assignees:
  - ppmarkek

status-website:
  cname: status.notularia.com
  logoUrl: https://notularia.com/press/notularia-app-icon-512.png
  name: Notularia status
  introTitle: Notularia status
  introMessage: The licence service and the website. Notularia itself works offline, so your notes are never affected.
  navbar:
    - title: Status
      href: /
    - title: notularia.com
      href: https://notularia.com
